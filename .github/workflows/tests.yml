name: Tests

on:
  push:
    paths-ignore: ["data/meta.json"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pipeline de datos (Python)
        run: python3 -m unittest discover -s tests -v
      - name: Estadística y probabilidades (JavaScript)
        run: node --test tests/*.test.mjs
